<!DOCTYPE html>
<html>
<head>
    <title>Test Login</title>
</head>
<body>
    <h1>Test Login</h1>
    <button onclick="testAdmin()">Test Admin Login</button>
    <button onclick="testFarmer()">Test Farmer Login</button>
    <button onclick="testRetailer()">Test Retailer Login</button>
    <div id="result"></div>

    <script>
        async function testLogin(email, password, role) {
            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                console.log('Success:', data);
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<pre style="color:red">Error: ${error.message}</pre>`;
                console.error('Error:', error);
            }
        }

        function testAdmin() {
            testLogin('pmpreethi25@gmail.com', 'Admin@123', 'ADMIN');
        }

        function testFarmer() {
            testLogin('preeths.252005@gmail.com', 'Murali@123', 'FARMER');
        }

        function testRetailer() {
            testLogin('paviii.061984@gmail.com', 'Pavi@123', 'RETAILER');
        }
    </script>
</body>
</html>
