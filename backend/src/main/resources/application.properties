spring.application.name=agri-pulse
server.port=8080

# Disable Tomcat APR on Windows to avoid native library issues
server.tomcat.accesslog.enabled=false

# H2 Database - Using file-based for persistence
spring.datasource.url=jdbc:h2:./agripulse_db;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=preeths.252005@gmail.com
spring.mail.password=eaidlnrogovhrrhj
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=AgriPulseSecretKeyForJWTTokenGenerationAndValidation2024
jwt.expiration=86400000

# CORS
cors.allowed.origins=http://localhost:3000,http://localhost:3001,http://localhost:8081

# Logging
logging.level.com.agripulse=DEBUG
logging.level.org.springframework.web=DEBUG
